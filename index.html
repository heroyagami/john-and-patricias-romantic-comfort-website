  <body>
    <div class="preloader">
      <div class="preloader__inner">
        <div class="preloader__progress-wrapper">
          <div class="preloader__progress-bar"></div>
        </div>
        <span class="preloader__percent">0%</span>

        <div class="preloader__intro">
          <p class="preloader__eyebrow">WEDDING INVITATION</p>
          <h1 class="preloader__title">吴昊 <span>×</span> 舒倩</h1>
          <p class="preloader__description">
            我们结婚啦。想请你来吃顿喜酒，<br />
            和我们一起见证这个重要的日子。
          </p>
          <div class="preloader__meta">
            <strong>2026年10月2日 · 中午12:00</strong>
            <span>湖北省咸宁市崇阳县 · 詹氏糯米酒超市对面</span>
          </div>
          <div class="preloader__buttons">
            <button id="enter-btn" class="preloader__btn preloader__btn--primary">
              进入我们的婚礼
            </button>
            <button id="enter-silent-btn" class="preloader__btn preloader__btn--secondary">
              静音进入
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="experience-wrapper">
      <canvas id="experience-canvas"></canvas>
    </div>

    <button id="back-btn" class="back-btn">&#8592; 返回</button>

    <div class="top-right-controls">
      <button id="day-night-toggle" class="day-night-btn" data-mode="day" aria-label="切换昼夜">
        <span class="day-night-btn__icon">&#9790;</span>
      </button>
      <button id="info-btn" class="info-btn" aria-label="婚礼指南">i</button>
    </div>
